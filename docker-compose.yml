services:
  # One-shot migration job — mirrors CI's "apply then migrate then serve"
  # topology so the api never runs migrations at startup.
  migrate:
    build: ./backend
    entrypoint: ["/migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://hooprunstoday:hooprunstoday@db:5432/hooprunstoday?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://hooprunstoday:hooprunstoday@db:5432/hooprunstoday?sslmode=disable
      # Pinned to the project's Clerk dev instance; override via root .env
      CLERK_ISSUER: ${CLERK_ISSUER:-https://deep-seasnail-45.clerk.accounts.dev}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      # Container-local node_modules: host installs are macOS binaries
      - web_node_modules:/app/node_modules
    env_file:
      # Clerk keys live here (gitignored); copy web/.env.example to start
      - path: ./web/.env.local
        required: false
    environment:
      # Server actions run inside this container, so the API is reached
      # via service DNS — overrides the localhost value in .env.local.
      NEXT_PUBLIC_API_URL: http://api:8080
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hooprunstoday
      POSTGRES_PASSWORD: hooprunstoday
      POSTGRES_DB: hooprunstoday
    ports:
      # Host 5433: leaves the default port free for any natively installed
      # Postgres (e.g. Homebrew), whose loopback bind would otherwise
      # shadow the container on localhost.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hooprunstoday"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  web_node_modules:
