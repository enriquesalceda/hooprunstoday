services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hooprunstoday
      POSTGRES_PASSWORD: hooprunstoday
      POSTGRES_DB: hooprunstoday
    ports:
      # Host 5433: leaves the default port free for any natively installed
      # Postgres (e.g. Homebrew), whose loopback bind would otherwise
      # shadow the container on localhost.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hooprunstoday"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
