services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hooprunstoday
      POSTGRES_PASSWORD: hooprunstoday
      POSTGRES_DB: hooprunstoday
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hooprunstoday"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
