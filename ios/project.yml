# XcodeGen spec — the source of truth for the Xcode project.
# HoopRuns.xcodeproj is generated (`make ios.project`) and not committed.
name: HoopRuns
options:
  bundleIdPrefix: today.hoopruns
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  HoopRunsKit:
    path: Packages/HoopRunsKit
  Clerk:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.5.8

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: E8ZC4ECH2G
    CODE_SIGN_STYLE: Automatic

targets:
  HoopRuns:
    type: application
    platform: iOS
    sources: [App]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        APIBaseURL: $(API_BASE_URL)
        ClerkPublishableKey: $(CLERK_PUBLISHABLE_KEY)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: HoopRunsKit
        products: [API, DesignSystem, Features]
      - package: Clerk
        product: ClerkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: today.hoopruns.ios
        PRODUCT_NAME: HoopRuns
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HoopRuns
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HoopRunsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: HoopRuns
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: today.hoopruns.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HoopRuns.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HoopRuns

  HoopRunsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HoopRuns
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: today.hoopruns.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HoopRuns

schemes:
  HoopRuns:
    build:
      targets:
        HoopRuns: all
    test:
      targets:
        - package: HoopRunsKit/DomainTests
        - package: HoopRunsKit/APITests
        - package: HoopRunsKit/DesignSystemTests
        - package: HoopRunsKit/FeaturesTests
        - HoopRunsTests
        - HoopRunsUITests
