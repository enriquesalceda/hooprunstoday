# XcodeGen spec — the source of truth for the Xcode project.
# HoopRuns.xcodeproj is generated (`make ios.project`) and not committed.
name: HoopRuns
options:
  bundleIdPrefix: today.hoopruns
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  HoopRunsKit:
    path: Packages/HoopRunsKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  HoopRuns:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: HoopRunsKit
        products: [DesignSystem, Features]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: today.hoopruns.ios
        PRODUCT_NAME: HoopRuns
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HoopRuns
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HoopRunsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HoopRuns
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: today.hoopruns.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HoopRuns

schemes:
  HoopRuns:
    build:
      targets:
        HoopRuns: all
    test:
      targets:
        - package: HoopRunsKit/DesignSystemTests
        - HoopRunsUITests
