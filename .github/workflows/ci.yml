name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write # OIDC token exchange with GCP — no stored cloud keys

env:
  GCP_REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/hooprunstoday/api

jobs:
  # ---------------------------------------------------------------------------
  # Detect what changed so unrelated jobs are skipped
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            infra:
              - 'infra/**'
              # Workflow changes alter how deploys run — treat them as infra
              # so a workflow-only push still applies.
              - '.github/workflows/**'

  # ---------------------------------------------------------------------------
  # Backend: tests + static checks
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./...

  # ---------------------------------------------------------------------------
  # Infra: format + validate (no cloud credentials needed)
  # ---------------------------------------------------------------------------
  infra-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Validate
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate

  # ---------------------------------------------------------------------------
  # Terraform plan on PRs that touch infra
  # ---------------------------------------------------------------------------
  infra-plan:
    name: Terraform plan (staging)
    runs-on: ubuntu-latest
    needs: [changes, infra-validate]
    if: github.event_name == 'pull_request' && needs.changes.outputs.infra == 'true'
    environment: staging
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        working-directory: infra
        run: terraform init

      - name: Select workspace
        working-directory: infra
        run: terraform workspace select -or-create staging

      - name: Plan
        id: plan
        working-directory: infra
        run: terraform plan -var-file=envs/staging.tfvars -no-color
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan — \`staging\`

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output.substring(0, 65536)
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------------
  # Build + push the API image once; staging and prod deploy the same digest
  # ---------------------------------------------------------------------------
  build-image:
    name: Build API image
    runs-on: ubuntu-latest
    needs: [changes, backend-test]
    if: |
      github.event_name == 'push' &&
      needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the image tag is the last backend commit

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # Tag with the last commit that touched backend/ (== github.sha on
      # backend pushes). Deploy jobs resolve the same tag, so infra-only
      # pushes reuse the image already in the registry.
      - name: Build and push
        working-directory: backend
        run: |
          TAG=$(git log -1 --format=%H -- .)
          docker build -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

  # ---------------------------------------------------------------------------
  # Deploy: main -> staging automatically
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: [changes, build-image]
    # always() lets infra-only pushes (build skipped) still apply
    if: |
      always() && github.event_name == 'push' &&
      (needs.build-image.result == 'success' || (needs.build-image.result == 'skipped' && needs.changes.outputs.infra == 'true'))
    environment: staging
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tag (last backend commit)
        run: echo "TF_VAR_image_tag=$(git log -1 --format=%H -- backend/)" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          # No wrapper: it pollutes stdout, breaking `output -raw` capture
          terraform_wrapper: false

      - name: Init
        working-directory: infra
        run: terraform init

      - name: Select workspace
        working-directory: infra
        run: terraform workspace select -or-create staging

      - name: Apply
        working-directory: infra
        run: terraform apply -auto-approve -var-file=envs/staging.tfvars

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Run migrations
        working-directory: backend
        run: DATABASE_URL="$(terraform -chdir=../infra output -raw db_connection_uri)" go run ./cmd/migrate

  # ---------------------------------------------------------------------------
  # Deploy: prod behind a required-reviewer gate (GitHub Environment "prod")
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Deploy prod
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: always() && needs.deploy-staging.result == 'success'
    environment: prod
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      # Environment-scoped secret; feeds the Vercel CLERK_SECRET_KEY env var
      TF_VAR_clerk_secret_key: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tag (last backend commit)
        run: echo "TF_VAR_image_tag=$(git log -1 --format=%H -- backend/)" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init
        working-directory: infra
        run: terraform init

      - name: Select workspace
        working-directory: infra
        run: terraform workspace select -or-create prod

      - name: Apply
        working-directory: infra
        run: terraform apply -auto-approve -var-file=envs/prod.tfvars

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Run migrations
        working-directory: backend
        run: DATABASE_URL="$(terraform -chdir=../infra output -raw db_connection_uri)" go run ./cmd/migrate

  # ---------------------------------------------------------------------------
  # Web (Vercel) deploys itself via the GitHub integration — no job needed.
  # Mobile (Expo EAS) jobs get added here when mobile/ exists:
  #   push to main  -> eas update --branch staging
  #   git tag       -> eas build + eas submit (behind the prod environment gate)
  # ---------------------------------------------------------------------------
