<!-- @dsCard group="Type" viewport="700x200" name="Tracking" subtitle="Letter-spacing grows with importance — never below zero" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-app);font-family:var(--font-mono);font-weight:500;font-size:var(--mono-2);}
  .wrap{padding:18px 20px;}
  .row{display:flex;gap:12px;}
  .col{display:flex;flex-direction:column;}
  .k{font-size:var(--mono-2);color:var(--text-faint);white-space:nowrap;}
  .kk{font-size:var(--mono-1);color:var(--text-faint);white-space:nowrap;}
  .v{font-size:var(--mono-2);color:var(--text-secondary);white-space:nowrap;}
  .t{font-weight:700;font-size:var(--mono-4);color:var(--text-primary);}
</style></head><body><div class="wrap">
<div class="col" style="gap:10px;">
  <div style="display:flex;gap:16px;align-items:baseline;"><span class="t" style="letter-spacing:var(--track-label);width:280px;">OFFICIAL LEAGUE FIXTURE</span><span class="kk">--track-label 0.06EM · LONG SEGMENT LABELS</span></div>
  <div style="display:flex;gap:16px;align-items:baseline;"><span class="t" style="letter-spacing:var(--track-nav);width:280px;">LOG GAME</span><span class="kk">--track-nav 0.1EM · NAV, TABS, BANNERS</span></div>
  <div style="display:flex;gap:16px;align-items:baseline;"><span class="t" style="letter-spacing:var(--track-slider);width:280px;">ENGAGE BEACON</span><span class="kk">--track-slider 0.12EM · SLIDE-TO-ENGAGE</span></div>
  <div style="display:flex;gap:16px;align-items:baseline;"><span class="t" style="letter-spacing:var(--track-action);width:280px;">TRANSMIT SCORE DATA</span><span class="kk">--track-action 0.14EM · PRIMARY ACTION</span></div>
  <div style="display:flex;gap:16px;align-items:center;"><span style="background:var(--paper-000);color:var(--ink-900);font-family:var(--font-ui);font-weight:700;font-size:10px;letter-spacing:var(--track-bar);padding:4.5px 3px 4.5px 8px;">.TODAY</span><span class="kk">--track-bar 0.3EM / --track-bar-lg 0.4EM · LOGO BAR ONLY</span></div>
</div>
</div></body></html>
