<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-app);font-family:var(--font-mono);font-weight:500;font-size:var(--mono-2);}
  .wrap{padding:18px 20px;}
  .row{display:flex;gap:12px;}
  .col{display:flex;flex-direction:column;}
  .k{font-size:var(--mono-2);color:var(--text-faint);white-space:nowrap;}
  .kk{font-size:var(--mono-1);color:var(--text-faint);white-space:nowrap;}
  .v{font-size:var(--mono-2);color:var(--text-secondary);white-space:nowrap;}
  
</style></head><body><div class="wrap">
<div class="row">
  <div class="col" style="gap:6px;flex:1;min-width:0;">
  <div style="height:56px;background:#1f1f1e;border:var(--border-faint);"></div>
  <span class="k">FAINT DIVIDER</span><span class="kk">#1f1f1e</span><span class="kk">--line-faint</span></div>
  <div class="col" style="gap:6px;flex:1;min-width:0;">
  <div style="height:56px;background:#2a2a28;border:var(--border-faint);"></div>
  <span class="k">HAIRLINE / FRAME</span><span class="kk">#2a2a28</span><span class="kk">--line-hairline</span></div>
  <div class="col" style="gap:6px;flex:1;min-width:0;">
  <div style="height:56px;background:#444444;border:var(--border-faint);"></div>
  <span class="k">INTERACTIVE</span><span class="kk">#444444</span><span class="kk">--line-interactive</span></div>
  <div class="col" style="gap:6px;flex:1;min-width:0;">
  <div style="height:56px;background:#555555;border:var(--border-faint);"></div>
  <span class="k">CHIP</span><span class="kk">#555555</span><span class="kk">--line-chip</span></div>
</div>
</div></body></html>
