<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-paper);font-family:var(--font-mono);font-weight:500;font-size:var(--mono-2);}
  .wrap{padding:18px 20px;}
  .row{display:flex;gap:12px;}
  .col{display:flex;flex-direction:column;}
  .k{font-size:var(--mono-2);color:var(--text-faint);white-space:nowrap;}
  .kk{font-size:var(--mono-1);color:var(--text-faint);white-space:nowrap;}
  .v{font-size:var(--mono-2);color:var(--text-secondary);white-space:nowrap;}
  .k,.kk{color:var(--text-faint-on-paper);} .w{font-family:var(--font-display);color:var(--ink-900);letter-spacing:var(--track-logo);line-height:var(--lh-logo);}
</style></head><body><div class="wrap">
<div style="display:flex;align-items:flex-end;gap:44px;">
  <div style="display:inline-flex;flex-direction:column;">
    <span class="w" style="font-size:76px;">HOOP</span>
    <span class="w" style="font-size:76px;">RUNS</span>
    <div style="margin-top:10px;background:var(--ink-900);color:var(--paper-000);text-align:center;font-family:var(--font-ui);font-weight:700;font-size:11.7px;letter-spacing:var(--track-bar-lg);padding:6.5px 0 6.5px 5px;">.TODAY</div>
  </div>
  <div class="col" style="gap:16px;">
    <span style="display:inline-flex;align-items:center;gap:8px;"><span style="font-family:var(--font-display);font-size:30px;line-height:1;color:var(--ink-900);">HOOPRUNS</span><span style="background:var(--ink-900);color:var(--paper-000);font-family:var(--font-ui);font-weight:700;font-size:10px;letter-spacing:var(--track-bar);padding:4.5px 3px 4.5px 8px;">.TODAY</span></span>
    <span style="display:inline-flex;align-items:center;gap:8px;background:var(--blacktop-900);padding:12px 16px;"><span style="font-family:var(--font-display);font-size:30px;line-height:1;color:var(--paper-000);">HOOPRUNS</span><span style="background:var(--paper-000);color:var(--ink-900);font-family:var(--font-ui);font-weight:700;font-size:10px;letter-spacing:var(--track-bar);padding:4.5px 3px 4.5px 8px;">.TODAY</span></span>
    <div class="col" style="gap:4px;"><span class="kk">ANTON 400 · CAPS · +1PX · LINE-HEIGHT 0.84</span><span class="kk">BAR: HELVETICA BOLD · +0.4EM · SPANS THE STACK</span><span class="kk">CLEAR SPACE = BAR HEIGHT · STACK MIN 64PX · ONE-LINE MIN 24PX</span></div>
  </div>
</div>
</div></body></html>
