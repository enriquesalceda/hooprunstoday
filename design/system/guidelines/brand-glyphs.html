<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-app);font-family:var(--font-mono);font-weight:500;font-size:var(--mono-2);}
  .wrap{padding:18px 20px;}
  .row{display:flex;gap:12px;}
  .col{display:flex;flex-direction:column;}
  .k{font-size:var(--mono-2);color:var(--text-faint);white-space:nowrap;}
  .kk{font-size:var(--mono-1);color:var(--text-faint);white-space:nowrap;}
  .v{font-size:var(--mono-2);color:var(--text-secondary);white-space:nowrap;}
  
</style></head><body><div class="wrap">
<div class="row" style="gap:0;border:var(--border-hairline);">
  <div class="col" style="flex:1;gap:8px;align-items:center;padding:16px 0;"><span style="font-size:22px;color:var(--text-primary);">●</span><span class="kk">LIVE · ● LIVE CHIP</span></div>
  <div class="col" style="flex:1;gap:8px;align-items:center;padding:16px 0;border-left:var(--border-hairline);"><span style="font-size:22px;color:var(--text-primary);">▶</span><span class="kk">YOU ARE HERE · BANNER</span></div>
  <div class="col" style="flex:1;gap:8px;align-items:center;padding:16px 0;border-left:var(--border-hairline);"><span style="font-family:var(--font-display);font-size:26px;color:var(--text-primary);">→</span><span class="kk">DRAG ME · SLIDER HANDLE</span></div>
  <div class="col" style="flex:1;gap:8px;align-items:center;padding:16px 0;border-left:var(--border-hairline);"><span style="font-size:22px;color:var(--text-primary);">←</span><span class="kk">BACK · ← RADAR</span></div>
</div>
<span class="kk" style="display:block;padding-top:14px;">DO NOT ADD LUCIDE / HEROICONS / MATERIAL · NO EMOJI, EVER · LABELS ARE TYPED OUT IN MONO</span>
</div></body></html>
