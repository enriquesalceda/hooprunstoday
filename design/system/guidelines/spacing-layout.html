<!-- @dsCard group="Spacing" viewport="700x190" name="Layout tokens" subtitle="Frames, gutters, columns, and control sizes" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-app);font-family:var(--font-mono);font-weight:500;font-size:var(--mono-2);}
  .wrap{padding:18px 20px;}
  .row{display:flex;gap:12px;}
  .col{display:flex;flex-direction:column;}
  .k{font-size:var(--mono-2);color:var(--text-faint);white-space:nowrap;}
  .kk{font-size:var(--mono-1);color:var(--text-faint);white-space:nowrap;}
  .v{font-size:var(--mono-2);color:var(--text-secondary);white-space:nowrap;}
  
</style></head><body><div class="wrap">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;">
  <div style="display:flex;justify-content:space-between;border-bottom:var(--border-faint);padding-bottom:5px;"><span class="k">--frame-mobile</span><span class="v">390 × 844</span></div>
  <div style="display:flex;justify-content:space-between;border-bottom:var(--border-faint);padding-bottom:5px;"><span class="k">--frame-web</span><span class="v">1280 × 820</span></div>
  <div style="display:flex;justify-content:space-between;border-bottom:var(--border-faint);padding-bottom:5px;"><span class="k">--gutter-mobile</span><span class="v">16px</span></div>
  <div style="display:flex;justify-content:space-between;border-bottom:var(--border-faint);padding-bottom:5px;"><span class="k">--gutter-web</span><span class="v">24px</span></div>
  <div style="display:flex;justify-content:space-between;border-bottom:var(--border-faint);padding-bottom:5px;"><span class="k">--header-h-web</span><span class="v">58px</span></div>
  <div style="display:flex;justify-content:space-between;border-bottom:var(--border-faint);padding-bottom:5px;"><span class="k">--rail-web</span><span class="v">400px</span></div>
  <div style="display:flex;justify-content:space-between;border-bottom:var(--border-faint);padding-bottom:5px;"><span class="k">--portrait-col-web</span><span class="v">360px</span></div>
  <div style="display:flex;justify-content:space-between;border-bottom:var(--border-faint);padding-bottom:5px;"><span class="k">--form-col-web</span><span class="v">680px</span></div>
  <div style="display:flex;justify-content:space-between;border-bottom:var(--border-faint);padding-bottom:5px;"><span class="k">--slider-h</span><span class="v">76px (square)</span></div>
  <div style="display:flex;justify-content:space-between;border-bottom:var(--border-faint);padding-bottom:5px;"><span class="k">--button-h</span><span class="v">60 / 62px</span></div>
  <div style="display:flex;justify-content:space-between;"><span class="k">--hit-min</span><span class="v">44px</span></div>
  <div style="display:flex;justify-content:space-between;"><span class="k">--portrait-h-mobile / web</span><span class="v">264 / 400px</span></div>
</div>
</div></body></html>
