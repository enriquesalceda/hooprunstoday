<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-app);font-family:var(--font-mono);font-weight:500;font-size:var(--mono-2);}
  .wrap{padding:18px 20px;}
  .row{display:flex;gap:12px;}
  .col{display:flex;flex-direction:column;}
  .k{font-size:var(--mono-2);color:var(--text-faint);white-space:nowrap;}
  .kk{font-size:var(--mono-1);color:var(--text-faint);white-space:nowrap;}
  .v{font-size:var(--mono-2);color:var(--text-secondary);white-space:nowrap;}
  
</style></head><body><div class="wrap">
<div class="col" style="gap:8px;">
  <span class="k">COURT DIRECTORY // 3 TRACKED</span>
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:6px;">
    <span style="font-family:var(--font-display);font-size:46px;line-height:var(--lh-display-loose);color:var(--text-primary);">PRINCE ALFRED PARK</span>
    <span style="background:var(--selected-bg);color:var(--selected-ink);font-weight:700;font-size:var(--mono-2);padding:4px 8px;margin-top:4px;white-space:nowrap;">● LIVE</span>
  </div>
  <div style="display:flex;gap:20px;color:var(--text-secondary);font-size:var(--mono-4);"><span>0.4 KM</span><span>14 ON COURT</span><span style="color:var(--text-faint);">NEXT: 3V3 HALFCOURT</span></div>
  <span style="font-size:var(--body-size);line-height:var(--body-lh-web);color:var(--text-body);padding-top:8px;text-wrap:pretty;">Squads forming on West Hoop. Need one to hold court.</span>
</div>
</div></body></html>
