<!-- @dsCard group="Colors" viewport="700x170" name="Paper + ink" subtitle="Brand sheets and print only — never inside product UI" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-desk);font-family:var(--font-mono);font-weight:500;font-size:var(--mono-2);}
  .wrap{padding:18px 20px;}
  .row{display:flex;gap:12px;}
  .col{display:flex;flex-direction:column;}
  .k{font-size:var(--mono-2);color:var(--text-faint);white-space:nowrap;}
  .kk{font-size:var(--mono-1);color:var(--text-faint);white-space:nowrap;}
  .v{font-size:var(--mono-2);color:var(--text-secondary);white-space:nowrap;}
  .k,.kk{color:var(--text-faint-on-paper);}
</style></head><body><div class="wrap">
<div class="row">
  <div class="col" style="gap:6px;flex:1;min-width:0;">
  <div style="height:56px;background:#ffffff;border:var(--border-faint);"></div>
  <span class="k">PAPER</span><span class="kk">#ffffff</span><span class="kk">--paper-000</span></div>
  <div class="col" style="gap:6px;flex:1;min-width:0;">
  <div style="height:56px;background:#eceae6;border:var(--border-faint);"></div>
  <span class="k">DESK</span><span class="kk">#eceae6</span><span class="kk">--paper-100</span></div>
  <div class="col" style="gap:6px;flex:1;min-width:0;">
  <div style="height:56px;background:#e4e2dd;border:var(--border-faint);"></div>
  <span class="k">PAPER HAIRLINE</span><span class="kk">#e4e2dd</span><span class="kk">--paper-200</span></div>
  <div class="col" style="gap:6px;flex:1;min-width:0;">
  <div style="height:56px;background:#111111;border:var(--border-faint);"></div>
  <span class="k">BRAND INK</span><span class="kk">#111111</span><span class="kk">--ink-900</span></div>
</div>
</div></body></html>
