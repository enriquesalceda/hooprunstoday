<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-app);font-family:var(--font-mono);font-weight:500;font-size:var(--mono-2);}
  .wrap{padding:18px 20px;}
  .row{display:flex;gap:12px;}
  .col{display:flex;flex-direction:column;}
  .k{font-size:var(--mono-2);color:var(--text-faint);white-space:nowrap;}
  .kk{font-size:var(--mono-1);color:var(--text-faint);white-space:nowrap;}
  .v{font-size:var(--mono-2);color:var(--text-secondary);white-space:nowrap;}
  .d{font-family:var(--font-display);color:var(--text-primary);line-height:1;}
</style></head><body><div class="wrap">
<div class="col" style="gap:8px;">
  <div style="display:flex;align-items:flex-end;gap:16px;"><span class="d" style="font-size:120px;line-height:var(--lh-display-tight);">875</span><span class="kk">--display-8 120PX · LH 0.8 · STREET SCORE</span></div>
  <div style="display:flex;align-items:flex-end;gap:16px;"><span class="d" style="font-size:46px;">PRINCE ALFRED</span><span class="kk">--display-4 46PX · COURT NAME, WEB</span></div>
  <div style="display:flex;align-items:flex-end;gap:16px;"><span class="d" style="font-size:34px;">WATERLOO OVAL</span><span class="kk">--display-2 34PX · COURT NAME, MOBILE</span></div>
  <span class="kk" style="padding-top:4px;">SCALE · 20 / 34 / 40 / 46 / 56 / 76 / 96 / 120 / 140</span>
</div>
</div></body></html>
