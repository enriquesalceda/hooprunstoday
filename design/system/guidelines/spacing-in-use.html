<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing in use" subtitle="Full-bleed rows, hairline separated, gutter-inset content" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-app);font-family:var(--font-mono);font-weight:500;font-size:var(--mono-2);}
  .wrap{padding:18px 20px;}
  .row{display:flex;gap:12px;}
  .col{display:flex;flex-direction:column;}
  .k{font-size:var(--mono-2);color:var(--text-faint);white-space:nowrap;}
  .kk{font-size:var(--mono-1);color:var(--text-faint);white-space:nowrap;}
  .v{font-size:var(--mono-2);color:var(--text-secondary);white-space:nowrap;}
  .r{padding:16px 16px;border-bottom:var(--border-hairline);}
</style></head><body><div class="wrap">
<div style="margin:0 -20px;border-top:var(--border-hairline);">
  <div class="r"><div style="display:flex;justify-content:space-between;"><span style="font-family:var(--font-display);font-size:34px;line-height:.95;color:var(--text-primary);">WATERLOO OVAL</span><span class="kk" style="align-self:flex-start;">16PX GUTTER</span></div><div style="display:flex;gap:12px;padding-top:8px;color:var(--text-secondary);font-size:var(--mono-3);"><span>1.2 KM</span><span>6 ON COURT</span></div></div>
  <div class="r"><div style="display:flex;justify-content:space-between;"><span style="font-family:var(--font-display);font-size:34px;line-height:.95;color:var(--text-primary);">REDFERN COMMUNITY CT</span><span class="kk" style="align-self:flex-start;">1PX HAIRLINE, NO GAP</span></div></div>
</div>
</div></body></html>
