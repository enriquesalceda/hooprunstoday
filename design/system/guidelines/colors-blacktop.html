<!-- @dsCard group="Colors" viewport="700x170" name="Blacktop surfaces" subtitle="The dark product world — four steps, no hue" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;background:var(--surface-app);font-family:var(--font-mono);font-weight:500;font-size:var(--mono-2);}
  .wrap{padding:18px 20px;}
  .row{display:flex;gap:12px;}
  .col{display:flex;flex-direction:column;}
  .k{font-size:var(--mono-2);color:var(--text-faint);white-space:nowrap;}
  .kk{font-size:var(--mono-1);color:var(--text-faint);white-space:nowrap;}
  .v{font-size:var(--mono-2);color:var(--text-secondary);white-space:nowrap;}
  
</style></head><body><div class="wrap">
<div class="row">
  <div class="col" style="gap:6px;flex:1;min-width:0;">
  <div style="height:56px;background:#0d0d0c;border:var(--border-faint);"></div>
  <span class="k">APP</span><span class="kk">#0d0d0c</span><span class="kk">--surface-app</span></div>
  <div class="col" style="gap:6px;flex:1;min-width:0;">
  <div style="height:56px;background:#141413;border:var(--border-faint);"></div>
  <span class="k">TRACK</span><span class="kk">#141413</span><span class="kk">--surface-track</span></div>
  <div class="col" style="gap:6px;flex:1;min-width:0;">
  <div style="height:56px;background:#1a1a19;border:var(--border-faint);"></div>
  <span class="k">RAISED / HOVER</span><span class="kk">#1a1a19</span><span class="kk">--surface-raised</span></div>
  <div class="col" style="gap:6px;flex:1;min-width:0;">
  <div style="height:56px;background:#1f1f1e;border:var(--border-faint);"></div>
  <span class="k">FAINT LINE</span><span class="kk">#1f1f1e</span><span class="kk">--blacktop-600</span></div>
</div>
</div></body></html>
