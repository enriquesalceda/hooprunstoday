<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Core</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; background: var(--surface-app); color: var(--text-primary); font-family: var(--font-mono); }
  #root { padding: 18px 20px; }
  .lbl { font-family: var(--font-mono); font-weight: 500; font-size: var(--mono-2); color: var(--text-faint); letter-spacing: var(--track-label); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function ns(name) {
  for (const k of Object.keys(window)) {
    if (k === 'React' || k === 'ReactDOM' || k === 'Babel') continue;
    try { const v = window[k]; if (v && typeof v === 'object' && typeof v[name] === 'function') return v; } catch (e) {}
  }
  return {};
}

const { Button, Chip, SectionLabel, Telemetry } = ns('Button');

function Demo() {
  return (
    <div style={{ display: 'grid', gap: 20 }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
        <Button height="var(--button-h)">TRANSMIT SCORE DATA</Button>
        <Button height="var(--button-h)" disabled>TRANSMIT SCORE DATA</Button>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
        <Chip variant="solid">● LIVE</Chip>
        <Chip variant="frame">OUTDOOR</Chip>
        <Chip variant="frame">INDOOR</Chip>
        <Chip variant="outline">LOCKDOWN</Chip>
        <Chip variant="outline">SNIPER</Chip>
        <Chip variant="outline">GLUE GUY</Chip>
      </div>
      <div style={{ display: 'grid', gap: 8, borderTop: 'var(--border-hairline)', paddingTop: 16 }}>
        <SectionLabel>COURT DIRECTORY // 3 TRACKED</SectionLabel>
        <SectionLabel>THE BLACKTOP BULLETIN</SectionLabel>
        <Telemetry geofence="NEWTOWN, SYD" status="SYS_ACTIVE" clock="18:42:07 LOCAL" />
        <Telemetry geofence="NEWTOWN, SYD" status="IN_GAME @ PRINCE" clock="18:44:31 LOCAL" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
