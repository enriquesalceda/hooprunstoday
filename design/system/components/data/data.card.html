<!-- @dsCard group="Components" viewport="700x340" name="Data" subtitle="Stat grid, score block, game log, roster" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; background: var(--surface-app); color: var(--text-primary); font-family: var(--font-mono); }
  #root { padding: 18px 20px; }
  .lbl { font-family: var(--font-mono); font-weight: 500; font-size: var(--mono-2); color: var(--text-faint); letter-spacing: var(--track-label); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function ns(name) {
  for (const k of Object.keys(window)) {
    if (k === 'React' || k === 'ReactDOM' || k === 'Babel') continue;
    try { const v = window[k]; if (v && typeof v === 'object' && typeof v[name] === 'function') return v; } catch (e) {}
  }
  return {};
}

const { StatGrid, ScoreBlock, GameLogRow, RosterRow } = ns('StatGrid');

function Demo() {
  return (
    <div style={{ display: 'grid', gap: 18 }}>
      <div style={{ display: 'grid', gridTemplateColumns: 'auto 1fr', gap: 28, alignItems: 'end' }}>
        <ScoreBlock value="875" rank="COURT LEGEND" />
        <StatGrid stats={[{ value: '24.5', label: 'PPG' }, { value: '6.2', label: 'RPG' }, { value: '7.1', label: 'APG' }]} />
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, alignItems: 'start' }}>
        <div style={{ display: 'grid', gap: 8 }}>
          <GameLogRow label="W 21 - 15 VS @southside_five" meta="VERIFIED · STREET · JUL 12" />
          <GameLogRow label="L 18 - 21 VS @wolves_d2" meta="PENDING · LEAGUE · TODAY" pending />
        </div>
        <div>
          <RosterRow name="NEWTOWN OUTLAWS" meta="DIV II · ACTIVE" />
          <RosterRow name="CITY 3X3 CHAMPION" meta="2025" />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
