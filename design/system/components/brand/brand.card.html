<!-- @dsCard group="Components" viewport="700x300" name="Brand" subtitle="Stacked + one-line lockups, both tones" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; background: var(--surface-app); color: var(--text-primary); font-family: var(--font-mono); }
  #root { padding: 18px 20px; }
  .lbl { font-family: var(--font-mono); font-weight: 500; font-size: var(--mono-2); color: var(--text-faint); letter-spacing: var(--track-label); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function ns(name) {
  for (const k of Object.keys(window)) {
    if (k === 'React' || k === 'ReactDOM' || k === 'Babel') continue;
    try { const v = window[k]; if (v && typeof v === 'object' && typeof v[name] === 'function') return v; } catch (e) {}
  }
  return {};
}

const { Logo } = ns('Logo');

function Demo() {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'auto auto 1fr', gap: 28, alignItems: 'center' }}>
      <Logo variant="stacked" tone="paper" size={64} />
      <div style={{ background: 'var(--surface-paper)', padding: 18 }}>
        <Logo variant="stacked" tone="ink" size={48} />
      </div>
      <div style={{ display: 'grid', gap: 16, justifyItems: 'start' }}>
        <Logo variant="oneline" tone="paper" size={30} />
        <Logo variant="oneline" tone="paper" size={20} />
        <div style={{ background: 'var(--surface-paper)', padding: '10px 14px' }}>
          <Logo variant="oneline" tone="ink" size={24} />
        </div>
        <span className="lbl">CLEAR SPACE = BAR HEIGHT · STACK MIN 64PX · ONE-LINE MIN 24PX</span>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
