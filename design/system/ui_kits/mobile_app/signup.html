<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<body>
<div id="root"></div>
<script type="text/babel">
function ns(name) {
  for (const k of Object.keys(window)) {
    if (k === 'React' || k === 'ReactDOM' || k === 'Babel') continue;
    try { const v = window[k]; if (v && typeof v === 'object' && typeof v[name] === 'function') return v; } catch (e) {}
  }
  return {};
}
const { MobileSignUpFlow } = ns('MobileSignUpFlow');
ReactDOM.createRoot(document.getElementById('root')).render(<MobileSignUpFlow />);
</script>
